[alembic]
# Alembic configuration file
# Documentation: https://alembic.sqlalchemy.org/en/latest/

# Path to migration scripts
script_location = database/migrations

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Set to 'true' to run "do nothing" when no changes detected
# This prevents the error when you run migrate with no changes
# prepend_sys_path = .

# The database URL is set in env.py (reads from app config)
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Truncate long revision IDs in output
truncate_slug_length = 40

# Set to 'true' to use two-phase transaction for offline migrations
# revision_environment = false

# Output encoding
# output_encoding = utf-8

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S